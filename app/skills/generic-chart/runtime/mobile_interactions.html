<style id="genericMobileTouchStyle">
svg:not(.markmap),canvas,#chart,#chart>div,.range-shell{touch-action:pan-y!important}
#viewport svg{touch-action:auto!important}
.treemap-cell{-webkit-tap-highlight-color:transparent;touch-action:pan-y}
</style>
<script id="genericMobileTouch">
(() => {
  const hits = '.hover-zone,.hit-area,.pie-slice,.ring-arc,.treemap-cell';
  let gesture = null, active = null, dismissTimer = null, nativeHovered = false, touchOrigin = null, placement = null;
  const emit = (node,type,event) => node?.dispatchEvent(new MouseEvent(type,{clientX:event.clientX,clientY:event.clientY,bubbles:false}));
  const clear = event => {
    clearTimeout(dismissTimer);dismissTimer=null;
    const hadTooltip=Boolean(active||nativeHovered);
    emit(active,'mouseleave',event);active=null;nativeHovered=false;placement=null;
    // Compatibility mouse events may open a native portal without setting active.
    if(hadTooltip&&typeof hideTooltip==='function')hideTooltip();
  };
  const dismiss = () => {gesture=null;clear({clientX:0,clientY:0});};
  const followRow = event => {
    if(!active?.matches('.hover-zone,.hit-area')||typeof parentTooltipContext!=='function')return;
    if(!placement){
      const ctx=parentTooltipContext();
      if(!ctx)return;
      const tip=ctx.element||(typeof parentTooltipElement==='function'?parentTooltipElement(ctx):null);
      if(!tip)return;
      placement={tip,offset:ctx.offsetLeft||0,width:tip.offsetWidth,viewport:ctx.win.innerWidth};
    }
    const {tip,offset,width,viewport}=placement,anchor=offset+event.clientX;
    const left=Math.max(8,Math.min(viewport-width-8,anchor-width/2));
    tip.style.left=left+'px';tip.style.setProperty('--arrow-left',Math.max(14,Math.min(width-14,anchor-left))+'px');
  };
  const direction = (state,x,y) => {
    if(state.direction==='pending'){
      const dx=Math.abs(x-state.x),dy=Math.abs(y-state.y);
      if(Math.max(dx,dy)>6)state.direction=dx>=dy?'horizontal':'vertical';
    }
    return state.direction;
  };
  const select = event => {
    const target=document.elementFromPoint(event.clientX,event.clientY)?.closest(hits)||event.target?.closest(hits);
    if(target!==active){clear(event);active=target;emit(active,'mouseenter',event);}
    // Row tooltips are anchored to the datum, so moving inside the same row
    // must not rebuild the portal and synchronously measure its geometry.
    if(active?.matches('.pie-slice,.ring-arc,.treemap-cell'))emit(active,'mousemove',event);
    followRow(event);
  };
  document.addEventListener('pointerdown',event=>{
    if(event.pointerType==='touch')clear(event);
    if(event.pointerType!=='touch'||event.target.closest?.('.markmap,.range-shell,button,input'))return;
    if(!event.target.closest?.('svg,canvas,.treemap-cell'))return;
    gesture={id:event.pointerId,x:event.clientX,y:event.clientY,direction:'pending'};
    select(event);
  },{capture:true,passive:true});
  document.addEventListener('pointermove',event=>{
    if(!gesture||event.pointerId!==gesture.id)return;
    const mode=direction(gesture,event.clientX,event.clientY);
    if(mode==='vertical'){clear(event);event.stopImmediatePropagation();return;
    }
    if(mode==='horizontal')select(event);
  },{capture:true,passive:true});
  document.addEventListener('pointerup',event=>{
    if(!gesture||event.pointerId!==gesture.id)return;
    if(gesture.direction!=='vertical')select(event);
    gesture=null;
    dismissTimer=setTimeout(dismiss,1200);
  },{passive:true});
  document.addEventListener('pointercancel',event=>{gesture=null;clear(event);},{passive:true});
  // Track the touch stream independently: pointercancel happens when the
  // browser starts scrolling, before legacy touchmove listeners finish.
  document.addEventListener('touchstart',event=>{
    if(event.touches.length!==1||event.target.closest?.('.markmap,.range-shell,input,textarea,select')){touchOrigin=null;return;}
    const t=event.touches[0];touchOrigin={x:t.clientX,y:t.clientY,direction:'pending'};
  },{capture:true,passive:true});
  document.addEventListener('touchmove',event=>{
    if(!touchOrigin||event.touches.length!==1)return;
    const t=event.touches[0],mode=direction(touchOrigin,t.clientX,t.clientY);
    if(mode==='vertical')event.stopImmediatePropagation();
    else if(mode==='horizontal')select({clientX:t.clientX,clientY:t.clientY,target:event.target});
  },{capture:true,passive:true});
  for(const type of ['touchend','touchcancel'])document.addEventListener(type,()=>{touchOrigin=null;},{passive:true});
  for(const type of ['mouseover','mouseenter','mousemove'])document.addEventListener(type,event=>{
    if(event.sourceCapabilities?.firesTouchEvents){event.stopImmediatePropagation();return;}
    if(event.target.closest?.(hits))nativeHovered=true;
  },{capture:true,passive:true});
  let host=window;
  try {
    while(host){
      for(const type of ['scroll','resize','pagehide','veya:chat-navigate'])host.addEventListener(type,dismiss,{capture:true,passive:true});
      if(host!==window)host.document.addEventListener('pointerdown',dismiss,{capture:true,passive:true});
      const doc=host.document;doc.addEventListener('visibilitychange',()=>{if(doc.hidden)dismiss();},{passive:true});
      if(host===host.parent)break;host=host.parent;
    }
  } catch (_) {}
})();
</script>
