<style id="dynamicLineMobileLayout">
.mobileDynamicHeader{display:block;position:absolute;left:0;right:0;top:0;z-index:2}
.mobileDynamicTitle{margin:0 0 10px;font:700 18px/1.4 sans-serif;overflow-wrap:anywhere}
.mobileDynamicLegend{display:flex;flex-wrap:wrap;gap:8px 18px}
.mobileDynamicLegend button{display:flex;align-items:center;gap:6px;min-width:0;padding:2px 0;border:0;background:transparent;color:inherit;font:12px/1.4 sans-serif;text-align:left;touch-action:manipulation}
.mobileDynamicLegend i{width:16px;height:4px;flex:none;border-radius:2px}
.mobileDynamicLegend b{font-weight:500;font-variant-numeric:tabular-nums}
.mobileDynamicLegend button[aria-pressed="false"]{opacity:.4}
#wrap #timelineBar{box-sizing:border-box;bottom:8px!important;min-width:0;left:var(--dynamic-player-left,0px)!important;right:var(--dynamic-player-right,0px)!important}
@media(max-width:720px){
 #wrap{height:var(--mobile-dynamic-height,380px)!important;min-height:0!important}
 .mobileDynamicHeader{display:block;position:absolute;left:0;right:0;top:0;z-index:2}
 .mobileDynamicTitle{margin:0 0 8px;font-size:14px;line-height:1.4;font-weight:700;color:var(--sv-text,#eef2f7);overflow-wrap:anywhere}
 .mobileDynamicLegend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 10px}
 .mobileDynamicLegend button{display:flex;align-items:center;gap:5px;min-width:0;padding:2px 0;border:0;background:transparent;color:inherit;font:10px/1.4 sans-serif;text-align:left;touch-action:manipulation}
 .mobileDynamicLegend i{width:12px;height:3px;flex-shrink:0;border-radius:2px}
 .mobileDynamicLegend span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .mobileDynamicLegend b{margin-left:1px;font-weight:500;flex-shrink:0;font-variant-numeric:tabular-nums}
 .mobileDynamicLegend button[aria-pressed="false"]{opacity:.4}
 #timelineBar{left:var(--dynamic-player-left,0px)!important;right:var(--dynamic-player-right,0px)!important;bottom:8px!important;gap:6px!important;padding:6px 8px!important;box-sizing:border-box;min-width:0;max-width:100%}
 #timelineBar #playBtn{box-shadow:0 2px 8px rgba(37,99,235,.24)!important}
 #timelineBar .timeLabel{min-width:22px!important}
 #timelineBar #playBtn,#timelineBar .pillBtn{flex-shrink:0}
}
</style>
<script>
const mobileLegendSelection={};

let dynamicFullRangeCache=null;
function getDynamicFullRange(){
 if(dynamicFullRangeCache)return dynamicFullRangeCache;
 const values=Object.values(fullSeriesDataMap).flat().filter(value=>value!==null&&value!==undefined&&value!=='').map(Number).filter(Number.isFinite);
 if(!values.length)return {};
 const low=Math.min(...values),high=Math.max(...values),span=high-low;
 const pad=span>0?span*.02:Math.max(1,Math.abs(high)*.06);
 const target=(span+2*pad)/4,power=Math.pow(10,Math.floor(Math.log10(target)));
 const steps=[1,2,2.5,5,10,20].map(n=>n*power);
 let step=steps.find(n=>n>=target)||steps.at(-1),min,max;
 for(const candidate of steps.filter(n=>n>=step)){
  step=candidate;
  min=Math.floor((low-pad)/(step/2))*(step/2);
  max=min+4*step;
  if(max>=high+pad)break;
 }
 dynamicFullRangeCache={min:Number(min.toPrecision(12)),max:Number(max.toPrecision(12)),interval:step};
 return dynamicFullRangeCache;
}
function getDynamicPlayerBottom(){return Math.ceil(document.getElementById('timelineBar').getBoundingClientRect().height)+24;}
function alignDynamicPlayer(){
 const wrap=document.getElementById('wrap');
 wrap.style.setProperty('--dynamic-player-left','0px');
 wrap.style.setProperty('--dynamic-player-right','0px');
}

function updateMobileDynamicHeader(){
 let header=document.querySelector('.mobileDynamicHeader');
 if(!header){header=document.createElement('div');header.className='mobileDynamicHeader';document.getElementById('wrap').append(header);}
 const compact=isCompactLayout();header.hidden=false;
 header.replaceChildren();
 const heading=document.createElement('div');heading.className='mobileDynamicTitle';heading.textContent=title;heading.style.color=window.__projectDynamicLineTheme.text;header.append(heading);
 const legend=document.createElement('div');legend.className='mobileDynamicLegend';legend.style.color=window.__projectDynamicLineTheme.muted;
 seriesList.forEach((name,index)=>{
  const button=document.createElement('button');button.type='button';button.title=name;button.setAttribute('aria-pressed',String(mobileLegendSelection[name]!==false));
  const marker=document.createElement('i');marker.style.background=colorPalette[index%colorPalette.length].line;
  const label=document.createElement('span');label.textContent=name.replace(/（(.*?)）/g,'·$1');
  const value=document.createElement('b'),data=fullSeriesDataMap[name]||[],point=getLastValidPoint(data.slice(0,Math.min(getSafeIndex(),data.length-1)+1));value.textContent=point?formatPlainValue(point.value):'—';
  button.append(marker,label,value);button.onclick=()=>{mobileLegendSelection[name]=mobileLegendSelection[name]===false;renderChart();};legend.append(button);
 });
 header.append(legend);
 const height=Math.ceil(header.getBoundingClientRect().height)+250+10+getDynamicPlayerBottom();
 const wrap=document.getElementById('wrap');
 if(compact && wrap.style.getPropertyValue('--mobile-dynamic-height')!==height+'px'){wrap.style.setProperty('--mobile-dynamic-height',height+'px');chart.resize();}
}
</script>
